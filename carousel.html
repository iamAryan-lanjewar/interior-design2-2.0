<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Interior | Instagram Carousel Posts</title>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .carousel-page {
            background-color: var(--clr-bg-light);
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .carousel-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: var(--clr-primary-dark);
            margin-bottom: 24px;
            transition: opacity 0.3s ease;
        }
        .back-link:hover {
            opacity: 0.7;
        }

        .insta-container {
            width: 100%;
            max-width: 600px;
            background: var(--clr-bg-white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            position: relative;
        }

        .insta-header {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .insta-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--clr-primary-dark);
            color: var(--clr-text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .insta-user-info {
            display: flex;
            flex-direction: column;
        }
        .insta-username {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--clr-text-main);
        }
        .insta-location {
            font-size: 0.8rem;
            color: var(--clr-text-muted);
        }

        .carousel-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
        }
        
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border: none;
            z-index: 25;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .carousel-nav:hover {
            background: rgba(255,255,255,1);
            transform: translateY(-50%) scale(1.05);
        }
        .carousel-prev { left: 16px; }
        .carousel-next { right: 16px; }
        .carousel-nav i { font-size: 1.5rem; color: #333; }
        
        .carousel-nav.hidden { display: none; }

        .insta-actions {
            padding: 16px;
            display: flex;
            gap: 24px; /* Increased distance between icons */
        }
        .insta-actions i {
            font-size: 1.8rem;
            color: var(--clr-text-main);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s;
        }
        .insta-actions i:hover { opacity: 0.7; }
        
        /* Like animation */
        .ph-heart.liked {
            color: #ed4956;
            animation: like-pop 0.3s ease-in-out;
        }
        @keyframes like-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        /* Share animation */
        .ph-paper-plane-tilt.shared {
            animation: share-fly 0.4s ease-in-out;
        }
        @keyframes share-fly {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(6px, -6px) rotate(10deg) scale(1.1); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }
        
        .insta-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(0,0,0,0.2);
            transition: background-color 0.3s ease;
        }
        .dot.active {
            background-color: var(--clr-accent);
        }

        .insta-caption {
            padding: 0 16px 24px;
            font-size: 0.95rem;
        }
        .insta-caption strong { font-weight: 600; }

        /* Hotspot for hand-drawn next arrow in slide 1 */
        .slide-next-arrow-hotspot {
            position: absolute;
            bottom: 3.2%;
            right: 0.8%;
            width: 80px;
            height: 80px;
            cursor: pointer;
            z-index: 20;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        /* Removed red hotspot-pulse styling */
        .slide-swipe-hotspot {
            position: absolute;
            top: 35%;
            right: 0.5%;
            width: 110px;
            height: 110px;
            cursor: pointer;
            z-index: 20;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="carousel-page">
        <div class="carousel-header">
            <a href="index.html" class="back-link">
                <i class="ph ph-arrow-left"></i> Back to Home
            </a>
            <h1 class="section-title">Design Guide</h1>
            <p>Pastel Aesthetic Minimalist Guide</p>
        </div>

        <div class="insta-container">
            <div class="insta-header">
                <div class="insta-avatar">HK</div>
                <div class="insta-user-info">
                    <span class="insta-username">hk.interiordesigns</span>
                    <span class="insta-location">Nagpur, India</span>
                </div>
            </div>

            <div class="carousel-wrapper">
                <div class="carousel-track" id="track">
                    <div class="carousel-slide" style="position: relative;">
                        <img src="carousel_images/1.png" alt="Slide 1">
                        <div class="slide-next-arrow-hotspot" id="slide1NextArrow" title="Next Slide"></div>
                        <div class="slide-swipe-hotspot" id="slide1SwipeBtn" title="Next Slide"></div>
                    </div>
                    <div class="carousel-slide"><img src="carousel_images/2.png" alt="Slide 2"></div>
                    <div class="carousel-slide"><img src="carousel_images/3.png" alt="Slide 3"></div>
                    <div class="carousel-slide"><img src="carousel_images/4.png" alt="Slide 4"></div>
                    <div class="carousel-slide"><img src="carousel_images/5.png" alt="Slide 5"></div>
                    <div class="carousel-slide"><img src="carousel_images/6.png" alt="Slide 6"></div>
                </div>
                
                <button class="carousel-nav carousel-prev hidden" id="btnPrev">
                    <i class="ph ph-caret-left"></i>
                </button>
                <button class="carousel-nav carousel-next" id="btnNext">
                    <i class="ph ph-caret-right"></i>
                </button>
            </div>

            <div class="insta-actions">
                <i class="ph ph-heart" id="likeBtn"></i>
                <i class="ph ph-paper-plane-tilt" id="shareBtn" title="Copy Website Link"></i>
            </div>
            
            <div class="insta-dots" id="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="insta-caption">
                <strong>hk.interiordesigns</strong> Check out our latest minimalist guide! Precision, Style, Perfection. ✨
            </div>
        </div>
    </div>

    <script>
        const track = document.getElementById('track');
        const slides = Array.from(track.children);
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const dotsContainer = document.getElementById('dots');
        const dots = Array.from(dotsContainer.children);
        const wrapper = document.querySelector('.carousel-wrapper');
        
        let currentIndex = 0;

        function updateCarousel() {
            // move track
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            // update buttons
            if (currentIndex === 0) {
                btnPrev.classList.add('hidden');
            } else {
                btnPrev.classList.remove('hidden');
            }
            
            // Always keep next button visible so it can act as "Next Page" link on last slide
            btnNext.classList.remove('hidden');
            
            // update dots
            dots.forEach(dot => dot.classList.remove('active'));
            dots[currentIndex].classList.add('active');
        }

        btnNext.addEventListener('click', () => {
            if (currentIndex < slides.length - 1) {
                currentIndex++;
                updateCarousel();
            } else {
                window.location.href = 'residential.html';
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCarousel();
            }
        });
        
        // Hand-drawn arrow hotspot click listener
        const slide1NextArrow = document.getElementById('slide1NextArrow');
        if (slide1NextArrow) {
            slide1NextArrow.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentIndex < slides.length - 1) {
                    currentIndex++;
                    updateCarousel();
                }
            });
        }
        
        // White circle swipe button click listener
        const slide1SwipeBtn = document.getElementById('slide1SwipeBtn');
        if (slide1SwipeBtn) {
            slide1SwipeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentIndex < slides.length - 1) {
                    currentIndex++;
                    updateCarousel();
                }
            });
        }
        
        // Unified Swipe and Drag Support (Touch & Mouse)
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let isHorizontalSwipe = false;
        
        // Touch events
        track.addEventListener('touchstart', e => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            currentX = startX;
            isHorizontalSwipe = false;
            track.style.transition = 'none';
        }, {passive: true});
        
        track.addEventListener('touchmove', e => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            const diffX = currentX - startX;
            const diffY = currentY - startY;
            
            // Detect if gesture is horizontal swipe
            if (!isHorizontalSwipe && Math.abs(diffX) > 10 && Math.abs(diffX) > Math.abs(diffY)) {
                isHorizontalSwipe = true;
            }
            
            if (isHorizontalSwipe) {
                if (e.cancelable) e.preventDefault();
                const percentage = (diffX / track.offsetWidth) * 100;
                const translate = -currentIndex * 100 + percentage;
                track.style.transform = `translateX(${translate}%)`;
            }
        }, {passive: false});
        
        track.addEventListener('touchend', e => {
            if (!isDragging) return;
            isDragging = false;
            track.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
            
            // Only transition if it was a horizontal swipe to avoid single taps changing slides
            if (isHorizontalSwipe) {
                const diffX = currentX - startX;
                if (diffX < -50) {
                    if (currentIndex < slides.length - 1) currentIndex++;
                } else if (diffX > 50) {
                    if (currentIndex > 0) currentIndex--;
                }
            } else {
                // Tap support on mobile: Tap right to go forward, left to go backward
                const diffX = currentX - startX;
                const diffY = e.changedTouches[0].clientY - startY;
                if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
                    if (e.target.closest('#slide1NextArrow') || e.target.closest('#slide1SwipeBtn') || e.target.closest('.carousel-nav') || e.target.closest('.insta-actions') || e.target.closest('.insta-dots')) return;
                    
                const rect = wrapper.getBoundingClientRect();
                    const clickX = e.changedTouches[0].clientX - rect.left;
                    if (clickX > rect.width / 2) {
                        if (currentIndex < slides.length - 1) {
                            currentIndex++;
                            updateCarousel();
                        } else {
                            window.location.href = 'residential.html';
                        }
                    } else {
                        if (currentIndex > 0) {
                            currentIndex--;
                            updateCarousel();
                        }
                    }
                    return;
                }
            }
            updateCarousel();
        });
        
        // Mouse events
        track.addEventListener('mousedown', e => {
            if (e.target.closest('#slide1NextArrow') || e.target.closest('#slide1SwipeBtn') || e.target.closest('.carousel-nav') || e.target.closest('.insta-actions') || e.target.closest('.insta-dots')) return;
            isDragging = true;
            startX = e.clientX;
            currentX = startX;
            track.style.transition = 'none';
            track.style.cursor = 'grabbing';
            e.preventDefault();
        });
        
        track.addEventListener('mousemove', e => {
            if (!isDragging) return;
            currentX = e.clientX;
            const diffX = currentX - startX;
            const percentage = (diffX / track.offsetWidth) * 100;
            const translate = -currentIndex * 100 + percentage;
            track.style.transform = `translateX(${translate}%)`;
        });
        
        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            track.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
            track.style.cursor = 'grab';
            const diffX = currentX - startX;
            
            // Tap/click support on desktop
            if (Math.abs(diffX) < 10) {
                if (e.target.closest('#slide1NextArrow') || e.target.closest('#slide1SwipeBtn') || e.target.closest('.carousel-nav') || e.target.closest('.insta-actions') || e.target.closest('.insta-dots')) return;
                
                const rect = wrapper.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                
                if (clickX > rect.width / 2) {
                    if (currentIndex < slides.length - 1) {
                        currentIndex++;
                        updateCarousel();
                    } else {
                        window.location.href = 'residential.html';
                    }
                } else {
                    if (currentIndex > 0) {
                        currentIndex--;
                        updateCarousel();
                    }
                }
                return;
            }

            if (diffX < -50) {
                if (currentIndex < slides.length - 1) currentIndex++;
            } else if (diffX > 50) {
                if (currentIndex > 0) currentIndex--;
            }
            updateCarousel();
        });
        
        track.style.cursor = 'grab';
        
        const likeBtn = document.getElementById('likeBtn');
        if (likeBtn) {
            likeBtn.addEventListener('click', () => {
                likeBtn.classList.toggle('ph-fill');
                likeBtn.classList.toggle('liked');
            });
        }
        
        const shareBtn = document.getElementById('shareBtn');
        
        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    alert("Website link copied to clipboard!");
                } else {
                    alert("Failed to copy link. (Try manually copying the URL)");
                }
            } catch (err) {
                alert("Failed to copy link. (Try manually copying the URL)");
            }
            document.body.removeChild(textArea);
        }

        if (shareBtn) {
            shareBtn.addEventListener('click', async () => {
                // Play animation
                shareBtn.classList.remove('shared');
                void shareBtn.offsetWidth; // trigger reflow
                shareBtn.classList.add('shared');
                
                const urlToShare = window.location.href;
                
                if (!navigator.clipboard) {
                    fallbackCopyTextToClipboard(urlToShare);
                    return;
                }
                try {
                    await navigator.clipboard.writeText(urlToShare);
                    alert("Website link copied to clipboard!");
                } catch (err) {
                    fallbackCopyTextToClipboard(urlToShare);
                }
            });
        }
    </script>
</body>
</html>
